# LoRA adapter configuration for BLOOM fine-tuning (Phase 2).
#
#   python -m src.lora.model summary --config configs/lora.yaml
#
# Kept parameter-efficient and CPU/low-VRAM friendly: a small rank on a
# small base checkpoint keeps the trainable parameter count a small
# fraction of the base model's total.
base_model_name: bigscience/bloomz-560m

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # BLOOM's attention module packs Q/K/V into one projection named
  # query_key_value -- that's the module LoRA adapters attach to here.
  target_modules:
    - query_key_value
